<!-- Widget Live Chat 24/7 & AI Tư Vấn Thông Minh -->
<div id="live-chat-bubble" onclick="toggleChatWindow()" style="position:fixed; bottom:24px; right:24px; width:60px; height:60px; background:var(--primary-hover); color:#FFFFFF; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:26px; box-shadow:var(--shadow-lg); cursor:pointer; z-index:999; transition:transform 0.3s;" onmouseover="this.style.transform='scale(1.08)'" onmouseout="this.style.transform='scale(1)'">
    🤖
</div>

<div id="live-chat-box" style="position:fixed; bottom:95px; right:24px; width:380px; height:520px; background:#FFFFFF; border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); border:2px solid var(--primary); display:none; flex-direction:column; z-index:999; overflow:hidden;">
    <!-- Header Chat với Tab Chuyển Đổi AI / Nhân Viên -->
    <div style="background:linear-gradient(90deg, #FF82AB, #FFA07A); color:#FFFFFF; padding:12px 16px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <div style="font-weight:900; font-size:14px; display:flex; align-items:center; gap:6px;">
                <span>✨ M&B Shop SMART ADVISOR</span>
            </div>
            <span onclick="toggleChatWindow()" style="cursor:pointer; font-size:18px; font-weight:bold;">✕</span>
        </div>
        
        <!-- Toggle Chế độ Chat: AI 24/7 vs Nhân Viên -->
        <div style="display:flex; background:rgba(255,255,255,0.25); border-radius:20px; padding:2px;">
            <button type="button" id="btn-mode-ai" onclick="switchChatMode('AI')" style="flex:1; border:none; background:#FFFFFF; color:var(--primary-hover); padding:5px 0; border-radius:18px; font-size:11px; font-weight:800; cursor:pointer; transition:all 0.2s;">
                🤖 AI Tư Vấn 24/7
            </button>
            <button type="button" id="btn-mode-staff" onclick="switchChatMode('STAFF')" style="flex:1; border:none; background:transparent; color:#FFFFFF; padding:5px 0; border-radius:18px; font-size:11px; font-weight:800; cursor:pointer; transition:all 0.2s;">
                👩‍💼 Nhân Viên CSKH
            </button>
        </div>
    </div>

    <!-- Quick Prompts Gợi Ý Nhu Cầu Nhanh -->
    <div id="chat-quick-prompts" style="background:#FFF5F8; padding:8px 12px; border-bottom:1px solid #FFE4EC; display:flex; gap:6px; overflow-x:auto; white-space:nowrap; font-size:11px;">
        <span onclick="sendQuickPrompt('Bé 6 tháng bị táo bón nên uống sữa nào?')" style="background:#FFFFFF; border:1px solid var(--primary); color:var(--primary-hover); padding:4px 8px; border-radius:12px; cursor:pointer; font-weight:700;">🍼 Sữa mát ngừa táo bón</span>
        <span onclick="sendQuickPrompt('Tư vấn chọn size tã bỉm cho bé 10kg')" style="background:#FFFFFF; border:1px solid var(--primary); color:var(--primary-hover); padding:4px 8px; border-radius:12px; cursor:pointer; font-weight:700;">🧷 Chọn size tã theo kg</span>
        <span onclick="sendQuickPrompt('Bình sữa chống sặc loại nào tốt nhất?')" style="background:#FFFFFF; border:1px solid var(--primary); color:var(--primary-hover); padding:4px 8px; border-radius:12px; cursor:pointer; font-weight:700;">🍼 Bình sữa chống sặc</span>
    </div>

    <!-- Khung Nội dung tin nhắn -->
    <div id="chat-messages-body" style="flex:1; padding:14px; overflow-y:auto; background:#FFF0F5; display:flex; flex-direction:column; gap:10px; font-size:13px;">
        <div style="background:#FFFFFF; padding:10px 14px; border-radius:12px; width:fit-content; max-width:88%; box-shadow:var(--shadow-sm); line-height:1.4;">
            👋 <strong>M&B Shop AI 24/7 xin chào ba mẹ!</strong><br>
            Em có thể tư vấn chọn sữa bột phù hợp độ tuổi, chọn size tã bỉm theo cân nặng hoặc gợi ý sản phẩm tốt nhất cho bé ngay lập tức ạ.
        </div>
    </div>

    <!-- Form Nhập tin nhắn -->
    <form id="chat-form" onsubmit="submitCustomerChat(event)" style="display:flex; border-top:1px solid var(--border-color); padding:10px; background:#FFFFFF; gap:6px;">
        <input type="text" id="chat-input" placeholder="Hỏi AI hoặc nhắn nhân viên..." required style="flex:1; border:1px solid var(--border-color); border-radius:20px; padding:8px 14px; font-size:13px; outline:none;">
        <button type="submit" style="background:var(--primary); color:#FFFFFF; border:none; border-radius:20px; padding:8px 16px; font-weight:800; cursor:pointer; transition:background 0.2s;">Gửi</button>
    </form>
</div>

<script>
let currentChatMode = 'AI';

function toggleChatWindow() {
    const box = document.getElementById('live-chat-box');
    box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
    if(box.style.display === 'flex') {
        fetchChatMessages();
    }
}

function switchChatMode(mode) {
    currentChatMode = mode;
    updateModeButtons(mode);
    
    const formData = new FormData();
    formData.append('switch_mode', mode);
    
    fetch('/chat/api/messages/', {
        method: 'POST',
        headers: {'X-CSRFToken': getCookie('csrftoken')},
        body: formData
    }).then(() => fetchChatMessages());
}

function updateModeButtons(mode) {
    const btnAi = document.getElementById('btn-mode-ai');
    const btnStaff = document.getElementById('btn-mode-staff');
    if(!btnAi || !btnStaff) return;
    
    if(mode === 'AI') {
        btnAi.style.background = '#FFFFFF';
        btnAi.style.color = '#E55B8A';
        btnStaff.style.background = 'transparent';
        btnStaff.style.color = '#FFFFFF';
    } else {
        btnStaff.style.background = '#FFFFFF';
        btnStaff.style.color = '#E55B8A';
        btnAi.style.background = 'transparent';
        btnAi.style.color = '#FFFFFF';
    }
}

function sendQuickPrompt(text) {
    document.getElementById('chat-input').value = text;
    document.getElementById('chat-form').dispatchEvent(new Event('submit'));
}

function fetchChatMessages() {
    fetch('/chat/api/messages/')
        .then(res => res.json())
        .then(data => {
            if(data.mode) {
                currentChatMode = data.mode;
                updateModeButtons(data.mode);
            }
            
            const body = document.getElementById('chat-messages-body');
            let html = `
                <div style="background:#FFFFFF; padding:10px 14px; border-radius:12px; width:fit-content; max-width:88%; box-shadow:var(--shadow-sm); line-height:1.4;">
                    👋 <strong>M&B Shop AI 24/7 xin chào ba mẹ!</strong><br>
                    Em có thể tư vấn chọn sữa bột phù hợp độ tuổi, chọn size tã bỉm theo cân nặng hoặc gợi ý sản phẩm tốt nhất cho bé ngay lập tức ạ.
                </div>
            `;
            
            data.messages.forEach(m => {
                const isMe = !m.is_staff;
                const bubbleBg = isMe ? '#FF82AB' : '#FFFFFF';
                const textColor = isMe ? '#FFFFFF' : '#2D3748';
                
                let productsHtml = '';
                if(m.products && m.products.length > 0) {
                    productsHtml += '<div style="margin-top:8px; display:flex; flex-direction:column; gap:6px;">';
                    m.products.forEach(p => {
                        productsHtml += `
                            <div style="display:flex; align-items:center; gap:8px; background:#FFF5F8; border:1px solid #FFD1DF; border-radius:8px; padding:6px; font-size:12px;">
                                <img src="${p.image}" style="width:40px; height:40px; object-fit:contain; border-radius:4px; background:#fff;">
                                <div style="flex:1;">
                                    <a href="${p.url}" target="_blank" style="font-weight:700; color:#2D3748; display:block; line-height:1.2;">${p.name}</a>
                                    <div style="color:#E55B8A; font-weight:800;">${p.price}</div>
                                </div>
                                <button type="button" class="btn-add-to-cart" data-product-id="${p.id}" style="background:#FF82AB; color:#fff; border:none; padding:4px 8px; border-radius:12px; font-size:11px; font-weight:700; cursor:pointer;">+ Mua</button>
                            </div>
                        `;
                    });
                    productsHtml += '</div>';
                }
                
                html += `
                    <div style="background:${bubbleBg}; color:${textColor}; padding:10px 14px; border-radius:12px; width:fit-content; max-width:88%; align-self:${isMe ? 'flex-end' : 'flex-start'}; box-shadow:var(--shadow-sm); line-height:1.4;">
                        <strong>${m.sender}:</strong><br>
                        ${m.text.replace(/\n/g, '<br>')}
                        ${productsHtml}
                        <div style="font-size:10px; opacity:0.75; text-align:right; margin-top:4px;">${m.time}</div>
                    </div>
                `;
            });
            
            body.innerHTML = html;
            body.scrollTop = body.scrollHeight;
            initAddToCartButtons();
        });
}

function submitCustomerChat(e) {
    e.preventDefault();
    const input = document.getElementById('chat-input');
    const msg = input.value.trim();
    if(!msg) return;
    
    const formData = new FormData();
    formData.append('message', msg);
    
    fetch('/chat/api/messages/', {
        method: 'POST',
        headers: {'X-CSRFToken': getCookie('csrftoken')},
        body: formData
    }).then(() => {
        input.value = '';
        fetchChatMessages();
    });
}

setInterval(() => {
    const box = document.getElementById('live-chat-box');
    if(box && box.style.display === 'flex') fetchChatMessages();
}, 4000);
</script>
