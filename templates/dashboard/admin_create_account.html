{% extends 'base.html' %}

{% block title %}Tạo Tài Khoản Nhân Viên / Admin - M&B Shop{% endblock %}

{% block content %}
<div class="section-white-box" style="max-width:560px; margin:30px auto; padding:30px;">
    <div class="section-box-header">
        <h1 class="section-box-title">➕ TẠO TÀI KHOẢN NHÂN VIÊN / ADMIN MỚI</h1>
        <a href="{% url 'dashboard:admin_staff_manage' %}" class="view-all-link">‹ Quay lại danh sách</a>
    </div>

    <form method="POST" style="display:flex; flex-direction:column; gap:14px; margin-top:16px;">
        {% csrf_token %}
        <div>
            <label style="font-size:13px; font-weight:700;">Họ và tên đầy đủ *</label>
            <input type="text" name="full_name" required placeholder="Ví dụ: Trần Thị Mai" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border-color); margin-top:4px;">
        </div>

        <div>
            <label style="font-size:13px; font-weight:700;">Tên đăng nhập (Username) *</label>
            <input type="text" name="username" required placeholder="Ví dụ: nhanvientuvan2" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border-color); margin-top:4px;">
        </div>

        <div>
            <label style="font-size:13px; font-weight:700;">Số điện thoại</label>
            <input type="tel" name="phone" placeholder="Ví dụ: 0912345678" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border-color); margin-top:4px;">
        </div>

        <div>
            <label style="font-size:13px; font-weight:700;">Mật khẩu ban đầu *</label>
            <input type="password" name="password" required placeholder="Tối thiểu 6 ký tự" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border-color); margin-top:4px;">
        </div>

        <div>
            <label style="font-size:13px; font-weight:700;">Phân quyền vai trò *</label>
            <select name="role" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border-color); margin-top:4px; font-weight:700;">
                <option value="STAFF">👩‍💼 Nhân Viên (Tư vấn bán hàng, xử lý đơn & ca trực)</option>
                <option value="ADMIN">👑 Quản Trị Viên (Toàn quyền quản lý hệ thống, doanh thu & nhân sự)</option>
            </select>
        </div>

        <button type="submit" class="btn-checkout-primary" style="margin-top:10px;">
            XÁC NHẬN TẠO TÀI KHOẢN
        </button>
    </form>
</div>
{% endblock %}
